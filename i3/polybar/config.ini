[colors]
background = #210536
background-alt = #363352
foreground = #E5E8F5
primary = #D3A7FC
secondary = #9B86D6
alert = #E06075
disabled = #707880

[bar/example]
width = 100%
height = 30pt
radius = 6

dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 8pt
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font;1

modules-left = launcher xworkspaces cava xwindow
modules-center = date
modules-right = tray eth cpu memory pulseaudio mic poweroff

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/tray]
type = internal/tray

format-margin = 4px
tray-spacing = 10px
tray-size = 20px
format-background = ${#FFFFFF}

[module/cava]
type = custom/script
tail = true
exec = $HOME/.config/polybar/cava.sh
format = <label>
format-font = 5
label = %output%

[module/powermenu]
type = custom/menu
expand-right = false

format-spacing = 1

label-open = 
label-open-foreground = #e06c75
label-close =  cancelar
label-close-foreground = #abb2bf
label-separator = |
label-separator-foreground = #5c6370

; Opção 1: Desligar
menu-0-0 = Desligar
menu-0-0-exec = loginctl poweroff

; Opção 2: Reiniciar
menu-0-1 = Reiniciar
menu-0-1-exec = loginctl reboot

[module/poweroff]
type = custom/text
content = 
content-foreground = #e06c75
click-left = pkexec /sbin/poweroff

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 30

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰝟 MUTED
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
wrapping-scroll = false

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/memory]
type = internal/memory
interval = 1
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %gb_used%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/launcher]
type = custom/text
label = " "
label-foreground = ${colors.primary}
click-left = jgmenu_run

[module/mic]
type = custom/script

exec = pactl get-source-mute @DEFAULT_SOURCE@ | grep -q "yes" && echo "%{F#707880}󰍭 MUTED%{F-}" || echo "%{F#8B73C7}󰍬%{F-} $(pactl get-source-volume @DEFAULT_SOURCE@ | grep -Po '\d+(?=%)' | head -n 1)%"
interval = 0

format-prefix-foreground = ${colors.primary}

click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
scroll-up = pactl set-source-volume @DEFAULT_SOURCE@ +5%
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈁 Connected
label-disconnected = 󰈂 Disconnected

[module/date]
type = internal/date
interval = 1

date =  %d-%m-%Y |  %H:%M:%S 
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${#ffff70}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
