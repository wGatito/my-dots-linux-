# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 3
blur_params_radius = 5
blur_params_noise = 0.01
blur_params_brightness = 1
blur_params_contrast = 1
blur_params_saturation = 1

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

border_radius = 8
no_radius_when_single = 0
focused_opacity = 1
unfocused_opacity = 0.9

dim_enable = 0
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000055

animations = 1
layer_animations = 1
animation_type_open = zoom
animation_type_close = zoom
layer_animation_type_open = zoom
layer_animation_type_close = zoom
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.30
zoom_end_ratio = 0.60
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.7
animation_duration_open = 500
animation_duration_close = 400
animation_duration_move = 500
animation_duration_tag = 700
animation_curve_open = 0.13,1.0,0.1,1.1
animation_curve_tag = 0.22,0.8,0.2,1.1
animation_curve_close = 0.15,0.85,0.25,1.0
animation_curve_move = 0.15,0.85,0.25,1.0
animation_curve_focus = 0.15,0.85,0.25,1.0
animation_curve_opacity_fade_in = 0.3,0.0,0.7,1.0
animation_curve_opacity_fade_out = 0.3,0.0,0.7,1.0

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size = 2
enable_hotarea = 1
hotarea_corner = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 20
overview_gap_outer = 40
overcircle_center_ratio = 0.5

# Misc
no_border_when_single = 1
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 1
snap_distance = 30
float_full_to_top = 0
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1
allow_tearing = 1
env=WLR_DRM_NO_ATOMIC,1

# keyboard
repeat_rate = 60
repeat_delay = 200
numlock_on = 0
xkb_rules_layout = br

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0

# Appearance
gap_inner_horizontal = 10
gap_inner_vertical = 10
gap_outer_horizontal = 10
gap_outer_vertical = 10
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 0
root_color = 0x201b14ff
border_color = 0x444444ff
drop_color = 0x8FBA7C77
split_color = 0xEB441EFF
focus_color = 0xc9b890ff
maximized_screen_color = 0x89aa61ff
urgent_color = 0xad401fff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule = id: 1, layout_name: dwindle
tag_rule = id: 2, layout_name: dwindle
tag_rule = id: 3, layout_name: dwindle
tag_rule = id: 4, layout_name: dwindle
tag_rule = id: 5, layout_name: dwindle
tag_rule = id: 6, layout_name: dwindle
tag_rule = id: 7, layout_name: dwindle
tag_rule = id: 8, layout_name: dwindle
tag_rule = id: 9, layout_name: dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
binds=SUPER,r,spawn,rofi -show drun
bind=SUPER,q,spawn,kitty

# my binds
bind=SUPER,w,spawn,firefox
bind=SUPER,e,spawn,hyprfm
bind=SUPER,d,spawn,waypaper --random
bind=SUPER,l,spawn,hyprlock
bind=SUPER,x,spawn,sh -c "pgrep -x waybar >/dev/null && killall waybar swaync awww-daemon || { waybar & swaync & awww-daemon & }"
bind=NONE,Print,spawn,env HYPRSHOT_DIR=$HOME/Imagens/Screenshots hyprshot -m region -- -- -b 00000026 -c 00ffffff -s 00000000
bind=SHIFT,Print,spawn,env HYPRSHOT_DIR=$HOME/Imagens/Screenshots hyprshot -m output
bind=SUPER,s,spawn,swaync-client -t -sw
bind=ALT,F4,spawn,true

# exit
bind=SUPER,m,quit
bind=SUPER,c,smartkillclient

# switch window focus
bind=ALT,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# media controls
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER,t,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverview,
bind=SUPER,p,restore_minimized
bind=SUPER,z,toggle_scratchpad

# special workspace
bind=SUPER,0,toggle_special_tag
bind=SUPER+SHIFT,0,tag_special_tag
bind=SUPER+CTRL,0,tag_special_silent

# dwindle layout (manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# switch workspaces
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# switch layout
bind=SUPER,n,switch_layout

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind = SUPER,btn_left,moveresize,curmove
mousebind = SUPER,btn_middle,togglemaximizescreen,0
mousebind = SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind = SUPER,UP,viewtoleft_have_client
axisbind = SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind = none,left,3,focusdir,left
gesturebind = none,right,3,focusdir,right
gesturebind = none,up,3,focusdir,up
gesturebind = none,down,3,focusdir,down
gesturebind = none,right,4,viewprev_have_client
gesturebind = none,left,4,viewnext_have_client
gesturebind = none,up,4,enteroverview
gesturebind = none,down,4,leaveoverview

# layer rule
layer_rule = animation_type_open:zoom,layer_name:rofi
layer_rule = animation_type_close:slide,layer_name:rofi
layer_rule = animation_type_open:slide,layer_name:swaync
layer_rule = animation_type_close:slide,layer_name:swaync
layer_rule = animation_type_open:slide,layer_name:waybar
layer_rule = animation_type_close:none,layer_name:waybar
layer_rule = no_blur:1,layer_name:selection
layer_rule = no_blur:1,layer_name:swaync
layer_rule = no_blur:1,layer_name:rofi
layer_rule = blur,layer_name:waybar
window_rule = app_id:geometrydash.exe,is_fullscreen:1
window_rule = app_id:steam_app_322170,is_fullscreen:1
window_rule = app_id:kitty,focused_opacity:0.7
window_rule = app_id:kitty,unfocused_opacity:0.6
window_rule = app_id:ghostty,focused_opacity:0.7
window_rule = app_id:ghostty,unfocused_opacity:0.6
window_rule = app_id:firefox,unfocused_opacity:1

# start with pc
exec_once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once = /usr/lib/xdg-desktop-portal-wlr
exec_once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once = sleep 2 && awww-daemon
exec_once = waybar &
exec_once = swaync &
exec_once = sh -c "sleep 1 && waypaper --restore"
exec_once = nm-applet --indicator
exec_once = wl-paste --type text --watch cliphist store
exec_once = sleep 6 && arch-update --tray
